
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HoloModel 3D Lab</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#07101e;color:#eaf7ff;font-family:Arial,sans-serif}
.app{height:100dvh;display:flex;flex-direction:column;padding:9px;gap:8px}
header{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:20px;font-weight:bold;letter-spacing:1px}
.brand span{color:#42e8ff}
#status{font-size:11px;color:#9cb5ca}
main{flex:1;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px}
.viewer{position:relative;min-height:0;overflow:hidden;border:1px solid #244a69;border-radius:15px;background:radial-gradient(ellipse,#102a42,#050b15 75%)}
#view{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:9px;left:9px;right:9px;display:flex;justify-content:space-between;pointer-events:none}
.pill{background:#061322dd;border:1px solid #28516a;border-radius:25px;padding:6px 9px;font-size:11px;color:#bdf7ff}
#hint{position:absolute;bottom:9px;left:8px;right:8px;text-align:center;font-size:11px;color:#c7eaff;pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:8px;background:#07101ef5;z-index:2;padding:15px}
.panel{background:#0c1929;border:1px solid #24415d;border-radius:13px;padding:9px}
.label{font-size:11px;color:#42e8ff;font-weight:bold;margin-bottom:7px}
.models,.controls{display:flex;gap:6px;overflow-x:auto;padding:2px 0 5px}
button{border:1px solid #2d4b67;background:#12243a;color:white;border-radius:9px;padding:8px 10px;min-height:36px;font-size:12px;white-space:nowrap}
button.active{border-color:#42e8ff;background:#104052}
.note{font-size:10px;color:#9cb5ca;line-height:1.4;margin-top:5px}
#camera{position:absolute;right:8px;bottom:30px;width:95px;border:1px solid #42e8ff;border-radius:8px;transform:scaleX(-1);z-index:3}
.hidden{display:none!important}
@media(orientation:landscape) and (max-height:500px){
.app{padding:5px;gap:5px}
main{grid-template-columns:minmax(0,1fr) 230px;grid-template-rows:minmax(0,1fr)}
.viewer{grid-column:1}.panel{grid-column:2;overflow:auto;padding:7px}
.models{display:grid;grid-template-columns:1fr 1fr}
.models button{white-space:normal;font-size:10px;padding:6px}
.brand{font-size:15px}
}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand">HOLO<span>MODEL</span></div>
<div id="status">3D LAB • Starting</div>
</header>
<main>
<section class="viewer" id="viewer">
<canvas id="view"></canvas>
<div class="hud">
<span class="pill" id="modelTitle">ARC REACTOR</span>
<span class="pill">DRAG • PINCH • HAND</span>
</div>
<div id="loading">3D Engine लोड हो रहा है…</div>
<div id="hint">Drag = Rotate • Two fingers = Zoom</div>
<video id="camera" class="hidden" autoplay playsinline muted></video>
</section>
<section class="panel">
<div class="label">3D MODEL GALLERY</div>
<div class="models" id="models">
<button class="active" data-model="reactor">Arc Reactor</button>
<button data-model="earth">Earth</button>
<button data-model="atom">Atom</button>
<button data-model="saturn">Saturn</button>
<button data-model="heart">Heart</button>
<button data-model="helmet">Sci-Fi Helmet</button>
</div>
<div class="label">CONTROLS</div>
<div class="controls">
<button id="hand">Enable Hand Tracking</button>
<button id="auto" class="active">Auto Rotate: ON</button>
<button id="zin">＋ Zoom</button>
<button id="zout">－ Zoom</button>
<button id="reset">Reset</button>
</div>
<div class="note">Move your hand to rotate. Pinch thumb and index finger to zoom. Allow camera access.</div>
</section>
</main>
</div>
<script type="module">
  
const $ = id => document.getElementById(id);
let THREE, scene, camera, renderer, group, clock;
let autoRotate = true, handOn = false, stream = null, tracker = null;
let rx = 0, ry = 0, zoom = 5.2;
let dragging = false, lastX = 0, lastY = 0;
let pinchDistance = 0;

function material(color, emissive = color) {
  return new THREE.MeshStandardMaterial({
    color, metalness: 0.7, roughness: 0.25,
    emissive, emissiveIntensity: 0.4
  });
}
function add(geometry, mat, x=0, y=0, z=0) {
  const obj = new THREE.Mesh(geometry, mat);
  obj.position.set(x,y,z);
  group.add(obj);
  return obj;
}
function ring(r, t, mat, x=0, y=0, z=0) {
  const obj = add(new THREE.TorusGeometry(r,t,12,80),mat);
  obj.rotation.set(x,y,z);
  return obj;
}
function buildModel(type) {
  group.clear();
  rx=0; ry=0; zoom=5.2;
  camera.position.z=zoom;
  const cyan=material(0x35eaff,0x0088aa);
  const gold=material(0xffae43,0x773300);
  const blue=material(0x176dff,0x002a99);
  const dark=material(0x182a40,0x06101d);
  const silver=material(0xb9d8eb,0x254c70);

  const names={
    reactor:"ARC REACTOR",earth:"EARTH",atom:"ATOM",
    saturn:"SATURN",heart:"HEART",helmet:"SCI-FI HELMET"
  };
  $("modelTitle").textContent=names[type]||"3D MODEL";
  document.querySelectorAll("[data-model]").forEach(b=>
    b.classList.toggle("active",b.dataset.model===type)
  );

  if(type==="reactor"){
    add(new THREE.CylinderGeometry(1.15,1.2,.22,48),dark);
    ring(1,.12,gold,Math.PI/2);
    ring(.75,.07,cyan,Math.PI/2);
    add(new THREE.CylinderGeometry(.62,.7,.13,12),blue,0,0,.1);
    ring(.48,.04,silver,Math.PI/2);
    add(new THREE.SphereGeometry(.25,28,20),cyan,0,0,.22);
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      const p=add(new THREE.BoxGeometry(.12,.34,.1),
        i%2?gold:silver,Math.cos(a)*.65,Math.sin(a)*.65,.15);
      p.rotation.z=a;
    }
  } else if(type==="earth"){
    add(new THREE.SphereGeometry(1.15,48,36),
      new THREE.MeshStandardMaterial({color:0x176bc4,roughness:.65}));
    for(let i=0;i<24;i++){
      const lat=-1.1+(i%8)*.3, lon=i*2.4, r=1.17;
      const p=add(new THREE.SphereGeometry(.13,10,8),
        material(0x39bb78,0x075a36),
        r*Math.cos(lat)*Math.cos(lon),
        r*Math.sin(lat),r*Math.cos(lat)*Math.sin(lon));
      p.scale.set(1.5,.5,1);
    }
    ring(1.4,.02,cyan,.3,.4,.1);
  } else if(type==="atom"){
    add(new THREE.SphereGeometry(.25,24,16),gold);
    for(let i=0;i<3;i++){
      const o=ring(1.1,.035,[cyan,silver,gold][i],i*.8,(i+1)*.7,i*.4);
      o.scale.y=.65;
    }
  } else if(type==="saturn"){
    add(new THREE.SphereGeometry(.75,40,28),gold);
    for(let i=0;i<4;i++){
      const o=ring(1+i*.13,.035,i%2?gold:cyan,.35,.15,.05);
      o.scale.y=.6;
    }
  } else if(type==="heart"){
    const red=material(0xe92e55,0x8d001e);
    add(new THREE.SphereGeometry(.46,24,18),red,-.3,.2,0);
    add(new THREE.SphereGeometry(.46,24,18),red,.3,.2,0);
    const tip=add(new THREE.ConeGeometry(.65,1.1,36),red,0,-.45,0);
    tip.rotation.z=Math.PI;
    ring(.9,.025,cyan,.3,.2,.1);
  } else if(type==="helmet"){
    add(new THREE.SphereGeometry(.9,40,28,0,Math.PI*2,0,Math.PI*.82),dark);
    add(new THREE.BoxGeometry(1.05,.23,.12),cyan,0,.05,.7);
    add(new THREE.BoxGeometry(.18,.45,.18),blue,-.7,-.2,.1);
    add(new THREE.BoxGeometry(.18,.45,.18),blue,.7,-.2,.1);
    ring(1,.035,cyan,Math.PI/2);
  }
}
function resizeViewer(){
  if(!renderer||!camera)return;
  const r=$("viewer").getBoundingClientRect();
  if(!r.width||!r.height)return;
  camera.aspect=r.width/r.height;
  camera.updateProjectionMatrix();
  renderer.setSize(r.width,r.height,false);
}
function animate(){
  requestAnimationFrame(animate);
  if(!renderer)return;
  const dt=Math.min(clock.getDelta(),.05);
  if(autoRotate&&!dragging&&!handOn)ry+=dt*.22;
  group.rotation.x+=(rx-group.rotation.x)*.15;
  group.rotation.y+=(ry-group.rotation.y)*.15;
  camera.position.z+=(zoom-camera.position.z)*.18;
  renderer.render(scene,camera);
}
async function startViewer(){
  try{
    THREE=await import(
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    );
    scene=new THREE.Scene();
    scene.fog=new THREE.FogExp2(0x07101e,.04);
    camera=new THREE.PerspectiveCamera(45,1,.1,80);
    camera.position.z=zoom;
    renderer=new THREE.WebGLRenderer({
      canvas:$("view"),antialias:true,alpha:true
    });
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    scene.add(new THREE.HemisphereLight(0xb5efff,0x10152b,2));
    const light=new THREE.DirectionalLight(0xffffff,3);
    light.position.set(3,4,5);
    scene.add(light);
    const glow=new THREE.PointLight(0x00bfff,18,12);
    glow.position.set(-2,1,2);
    scene.add(glow);
    group=new THREE.Group();
    scene.add(group);
    clock=new THREE.Clock();
    buildModel("reactor");
    resizeViewer();
    $("loading").classList.add("hidden");
    $("status").textContent="3D LAB • Ready";
    animate();
  }catch(e){
    $("loading").textContent="3D लोड नहीं हुआ। Internet जाँचकर Reload करें।";
    console.error(e);
  }
}
window.addEventListener("resize",resizeViewer);
window.addEventListener("orientationchange",()=>setTimeout(resizeViewer,250));
if(window.visualViewport)
  window.visualViewport.addEventListener("resize",resizeViewer);
new ResizeObserver(resizeViewer).observe($("viewer"));

$("models").addEventListener("click",e=>{
  const b=e.target.closest("[data-model]");
  if(b&&group)buildModel(b.dataset.model);
});
$("auto").onclick=()=>{
  autoRotate=!autoRotate;
  $("auto").textContent="Auto Rotate: "+(autoRotate?"ON":"OFF");
  $("auto").classList.toggle("active",autoRotate);
};
$("zin").onclick=()=>zoom=Math.max(2.1,zoom-.5);
$("zout").onclick=()=>zoom=Math.min(9,zoom+.5);
$("reset").onclick=()=>{rx=0;ry=0;zoom=5.2;};

const canvas=$("view");
canvas.addEventListener("pointerdown",e=>{
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove",e=>{
  if(!dragging)return;
  ry+=(e.clientX-lastX)*.009;
  rx=Math.max(-1.5,Math.min(1.5,rx+(e.clientY-lastY)*.009));
  lastX=e.clientX;lastY=e.clientY;
});
function stopDrag(){dragging=false;}
canvas.addEventListener("pointerup",stopDrag);
canvas.addEventListener("pointercancel",stopDrag);
canvas.addEventListener("lostpointercapture",stopDrag);
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  zoom=Math.max(2.1,Math.min(9,zoom+Math.sign(e.deltaY)*.3));
},{passive:false});

canvas.addEventListener("touchstart",e=>{
  if(e.touches.length===2){
    pinchDistance=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    dragging=false;
  }
},{passive:true});
canvas.addEventListener("touchmove",e=>{
  if(e.touches.length===2&&pinchDistance){
    const d=Math.hypot(
      e.touches[0].clientX-e.touches[1].clientX,
      e.touches[0].clientY-e.touches[1].clientY
    );
    zoom=Math.max(2.1,Math.min(9,zoom+(pinchDistance-d)*.012));
    pinchDistance=d;e.preventDefault();
  }
},{passive:false});
canvas.addEventListener("touchend",()=>pinchDistance=0,{passive:true});
