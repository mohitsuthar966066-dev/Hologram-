
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoloModel 3D Lab</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030712;color:#e7fbff;
font-family:Arial,sans-serif;overflow:hidden}
header{height:65px;padding:12px 16px;
border-bottom:1px solid #164e63;background:#07111f}
h2{margin:0;color:#43eaff;font-size:21px}
header small{color:#91a9bd}
#viewer{position:absolute;inset:65px 0 125px}
canvas{display:block;width:100%;height:100%;touch-action:none}
#info{position:absolute;top:77px;left:12px;
background:#071827dd;border:1px solid #17617b;
padding:9px 12px;border-radius:10px;pointer-events:none}
#info strong{color:#50eaff}
#panel{position:absolute;bottom:0;left:0;width:100%;
padding:10px;background:#07111ff5;
border-top:1px solid #164e63}
.models{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
button{background:#10263a;color:#e4faff;
border:1px solid #236078;border-radius:9px;
padding:11px 13px;font-size:14px;white-space:nowrap}
button.active{background:#07516a;border-color:#4ceaff;color:white}
.controls{display:flex;gap:8px;justify-content:center}
.controls button{flex:1}
#status{font-size:11px;color:#8caebd;margin-top:7px;text-align:center}
</style>
</head>
<body>
<header>
<h2>◈ HOLOMODEL LAB</h2>
<small>Interactive 3D Explorer</small>
</header>

<div id="viewer"></div>
<div id="info"><strong id="name">ARC REACTOR</strong><br>
<small id="hint">Drag to rotate · Pinch to zoom</small></div>

<div id="panel">
<div class="models">
<button class="active" data-model="reactor">⚡ Arc Reactor</button>
<button data-model="solar">🪐 Solar System</button>
<button data-model="earth">🌍 Earth</button>
<button data-model="dna">🧬 DNA</button>
<button data-model="atom">⚛ Atom</button>
<button data-model="robot">🤖 Robot</button>
</div>
<div class="controls">
<button id="rotate">⏸ Auto Rotate</button>
<button id="reset">↻ Reset View</button>
</div>
<div id="status">Loading 3D engine...</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { OrbitControls } from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const viewer = document.getElementById('viewer');
const status = document.getElementById('status');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030712);
scene.fog = new THREE.FogExp2(0x030712,0.025);

const camera = new THREE.PerspectiveCamera(
45, viewer.clientWidth/viewer.clientHeight,0.1,1000);
camera.position.set(0,2,9);

const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(viewer.clientWidth,viewer.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
viewer.appendChild(renderer.domElement);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 3;
controls.maxDistance = 20;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;

scene.add(new THREE.AmbientLight(0x8abfff,1.7));
const light = new THREE.PointLight(0x29ddff,100);
light.position.set(4,5,6);
scene.add(light);
const light2 = new THREE.PointLight(0x315cff,80);
light2.position.set(-5,-2,-4);
scene.add(light2);

const grid = new THREE.GridHelper(30,60,0x07536a,0x10263b);
grid.position.y = -2.8;
scene.add(grid);

const models = {};
let current = null;
const mat = (color,metalness=.5,roughness=.25,emissive=0) =>
new THREE.MeshStandardMaterial({color,metalness,roughness,
emissive:color,emissiveIntensity:emissive});
const blue = mat(0x16cfff,.7,.2,.35);
const cyan = mat(0x7cfaff,.5,.18,1.2);
const metal = mat(0x697f98,.9,.25);
const dark = mat(0x101e35,.8,.3);
const gold = mat(0xffb62e,.75,.22,.25);
const white = mat(0xd9f6ff,.3,.2,.25);

function group(){return new THREE.Group()}
function mesh(g,geo,m,x=0,y=0,z=0){
 const o=new THREE.Mesh(geo,m);
 o.position.set(x,y,z);g.add(o);return o;
}
function sphere(g,r,m,x=0,y=0,z=0){
 return mesh(g,new THREE.SphereGeometry(r,32,24),m,x,y,z);
}
function ring(g,r,t,m,x=0,y=0,z=0){
 return mesh(g,new THREE.TorusGeometry(r,t,12,96),m,x,y,z);
}
function cylinder(g,r1,r2,h,m,x=0,y=0,z=0){
 return mesh(g,new THREE.CylinderGeometry(r1,r2,h,32),m,x,y,z);
}
function rod(g,a,b,r,m){
 const start=new THREE.Vector3(...a),end=new THREE.Vector3(...b);
 const d=end.clone().sub(start);
 const o=mesh(g,new THREE.CylinderGeometry(r,r,d.length(),8),m);
 o.position.copy(start.add(end).multiplyScalar(.5));
 o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
 return o;
}

// 1. Arc Reactor
{
 const g=group();
 cylinder(g,1.35,1.35,.3,dark);
 ring(g,1.18,.12,metal);
 ring(g,.96,.065,gold);
 ring(g,.77,.075,cyan);
 ring(g,.52,.07,blue);
 ring(g,.28,.055,cyan);
 sphere(g,.21,cyan);
 for(let i=0;i<12;i++){
  const a=i*Math.PI/6;
  const o=mesh(g,new THREE.BoxGeometry(.16,.48,.16),gold,
  Math.cos(a)*.83,Math.sin(a)*.83,0);
  o.rotation.z=a;
 }
 for(let i=0;i<8;i++){
  const a=i*Math.PI/4;
  cylinder(g,.09,.09,.18,metal,
  Math.cos(a)*1.12,Math.sin(a)*1.12,.05);
 }
 models.reactor=g;
}

// 2. Solar System
{
 const g=group();
 sphere(g,.55,mat(0xff8b18,.2,.4,1.3));
 const colors=[0xaaa6a0,0xc98545,0x2998ff,0xc65e37,
  0xd6b78a,0xd7b66c,0x70dce0,0x397aff];
 const radii=[.82,1.15,1.55,1.95,2.65,3.25,3.75,4.25];
 const sizes=[.11,.16,.19,.14,.34,.29,.23,.22];
 for(let i=0;i<radii.length;i++){
  ring(g,radii[i],.012,mat(0x28516b,.2,.7));
  const p=group();g.add(p);
  sphere(p,sizes[i],mat(colors[i],.3,.5,.12),radii[i],0,0);
  p.userData.speed=.3/(i+1);
  p.userData.orbit=true;
 }
 models.solar=g;
}

// 3. Earth
{
 const g=group();
 const earth=sphere(g,1.5,mat(0x1676dc,.25,.7,.1));
 const wire=new THREE.Mesh(
 new THREE.SphereGeometry(1.515,24,16),
 new THREE.MeshBasicMaterial({color:0x36e7ff,wireframe:true,
 transparent:true,opacity:.18}));
 g.add(wire);
 const clouds=new THREE.Mesh(new THREE.SphereGeometry(1.54,32,24),
 new THREE.MeshBasicMaterial({color:0xc8f8ff,wireframe:true,
 transparent:true,opacity:.10}));
 g.add(clouds);
 ring(g,1.8,.018,cyan);
 models.earth=g;
}

// 4. DNA double helix
{
 const g=group();
 for(let i=0;i<65;i++){
  const t=i*.20,y=(i-32)*.075;
  const a=t*1.25;
  const p=[Math.cos(a),y,Math.sin(a)];
  const q=[-Math.cos(a),y,-Math.sin(a)];
  sphere(g,.075,blue,...p);
  sphere(g,.075,gold,...q);
  if(i%3===0)rod(g,p,q,.025,white);
 }
 models.dna=g;
}

// 5. Atom
{
 const g=group();
 sphere(g,.38,gold);
 for(let i=0;i<3;i++){
  const orbit=ring(g,1.45,.035,[cyan,blue,gold][i]);
  orbit.rotation.x=Math.PI/2;
  orbit.rotation.y=i*Math.PI/3;
  const e=sphere(g,.15,cyan,1.45,0,0);
  e.userData.orbitParent=orbit;
 }
 models.atom=g;
}

// 6. Robot
{
 const g=group();
 cylinder(g,.45,.5,.22,metal,0,-1.5,0);
 rod(g,[0,-1.4,0],[0,-.9,0],.16,metal);
 mesh(g,new THREE.BoxGeometry(1.1,1.0,.7),dark,0,-.35,0);
 mesh(g,new THREE.BoxGeometry(.84,.22,.12),blue,0,-.22,.38);
 cylinder(g,.5,.42,.2,metal,0,.35,0);
 sphere(g,.57,metal,0,1.05,0);
 mesh(g,new THREE.BoxGeometry(.75,.23,.15),dark,0,1.07,.46);
 sphere(g,.105,cyan,-.19,1.07,.55);
 sphere(g,.105,cyan,.19,1.07,.55);
 rod(g,[-.6,-.3,0],[-.95,-.9,0],.13,metal);
 rod(g,[.6,-.3,0],[.95,-.9,0],.13,metal);
 rod(g,[-.28,-.8,0],[-.32,-1.4,0],.15,metal);
 rod(g,[.28,-.8,0],[.32,-1.4,0],.15,metal);
 models.robot=g;
}

function selectModel(key){
 if(current)scene.remove(current);
 current=models[key];
 scene.add(current);
 current.position.set(0,0,0);
 current.scale.setScalar(key==='solar'?.78:key==='dna'?1.3:1);
 camera.position.set(0,1.5, key==='solar'?10:7);
 controls.target.set(0,0,0);
 controls.update();
 document.getElementById('name').textContent=
 key==='reactor'?'ARC REACTOR':key.toUpperCase();
 document.querySelectorAll('[data-model]').forEach(b=>
 b.classList.toggle('active',b.dataset.model===key));
 status.textContent='3D model ready · Drag to rotate · Pinch to zoom';
}
document.querySelectorAll('[data-model]').forEach(b=>{
 b.addEventListener('click',()=>selectModel(b.dataset.model));
});
document.getElementById('rotate').onclick=()=>{
 controls.autoRotate=!controls.autoRotate;
 document.getElementById('rotate').textContent=
 controls.autoRotate?'⏸ Auto Rotate':'▶ Auto Rotate';
};
document.getElementById('reset').onclick=()=>{
 camera.position.set(0,1.5,7);
 controls.target.set(0,0,0);
 controls.update();
};

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();
 Object.entries(models).forEach(([key,g])=>{
  if(key==='solar'){
   g.children.forEach(o=>{
    if(o.userData.orbit){
     // Keep planets on their orbiting paths.
     const idx=g.children.indexOf(o);
     const r=o.position.x;
     const a=t*.35/(1+idx/2);
     o.position.set(r*Math.cos(a),0,r*Math.sin(a));
    }
   });
  } else if(key==='earth'){
   g.rotation.y=t*.18;
  } else if(key==='reactor'){
   g.rotation.z=t*.12;
  } else if(key==='dna'){
   g.rotation.y=t*.22;
  } else if(key==='atom'){
   g.rotation.y=t*.3;
   g.rotation.x=.2;
  } else if(key==='robot'){
   g.rotation.y=Math.sin(t*.5)*.15;
  }
 });
 controls.update();
 renderer.render(scene,camera);
}
function resize(){
 const w=viewer.clientWidth,h=viewer.clientHeight;
 if(!w||!h)return;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h);
}
window.addEventListener('resize',resize);
selectModel('reactor');
status.textContent='Ready · 6 interactive models';
animate();
</script>
</body>
</html>
