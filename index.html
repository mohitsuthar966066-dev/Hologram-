
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HoloModel | Interactive Lab</title>

<style>
:root{
  --cyan:#42eaff;--bg:#030812;--panel:#071927;
  --line:#17475c;--green:#70ffc0;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  background:var(--bg);color:#d9f8ff;
  font-family:Arial,Helvetica,sans-serif;
  background-image:
  linear-gradient(#12304738 1px,transparent 1px),
  linear-gradient(90deg,#12304738 1px,transparent 1px);
  background-size:32px 32px;
}
header{
  height:65px;padding:10px 14px;display:flex;
  justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--line);background:#030812ed;
}
.brand{font-weight:bold;letter-spacing:3px;color:var(--cyan);font-size:18px}
.sub{font-size:10px;color:#90aebe;margin-top:5px}
.status{font-size:11px;color:var(--green);border:1px solid var(--line);padding:9px}
main{
  height:calc(100dvh - 65px);
  display:grid;grid-template-columns:155px minmax(0,1fr) 165px;
  gap:10px;padding:10px;min-height:0;
}
.panel{
  border:1px solid var(--line);background:#061522eF;
  padding:10px;min-width:0;overflow-y:auto;align-self:start;
}
h3{font-size:12px;color:var(--cyan);letter-spacing:2px;margin:2px 0 12px}
.models{display:grid;gap:7px}
button{
  font:inherit;color:#d9f8ff;background:#0a2638;
  border:1px solid #24566b;border-radius:3px;
  padding:11px 8px;min-height:42px;cursor:pointer;
  touch-action:manipulation;
}
button:active,button.active{background:#07516a;border-color:var(--cyan)}
button:focus-visible{outline:2px solid var(--cyan)}
.viewer{
  position:relative;min-width:0;min-height:0;overflow:hidden;
  border:1px solid #12384b;background:#020812;
}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#message{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  background:#071c2bed;border:1px solid #26758c;
  padding:9px 12px;font-size:12px;text-align:center;
  max-width:90%;z-index:3;pointer-events:none;
}
#controls{
  position:absolute;bottom:12px;left:8px;right:8px;
  display:flex;justify-content:center;align-items:center;
  flex-wrap:wrap;gap:6px;z-index:2;
}
#controls button{font-size:12px;padding:9px 11px;min-height:38px}
#handVideo{
  position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;
}
.telemetry{font-size:12px;color:#9bb8c7}
.metric{display:flex;justify-content:space-between;gap:5px;padding:11px 0;border-bottom:1px solid #173849}
.metric span:last-child{color:var(--green);text-align:right}
.hint{font-size:12px;line-height:1.7;color:#93aebd;margin-top:14px}
#zoomRange{width:100%;accent-color:var(--cyan);margin-top:10px}
#handPreview{
  display:none;position:absolute;right:8px;top:52px;
  width:90px;height:68px;object-fit:cover;opacity:.8;
  border:1px solid var(--line);transform:scaleX(-1);
}
@media(max-width:650px){
  header{height:57px;padding:8px 10px}
  .brand{font-size:15px;letter-spacing:2px}
  .sub{font-size:9px}
  .status{font-size:10px;padding:7px}
  main{
    height:calc(100dvh - 57px);
    display:flex;flex-direction:column;padding:7px;gap:7px;
  }
  .panel{padding:7px;width:100%;flex:none}
  .panel h3{margin:0 0 7px;font-size:10px}
  #library{order:0}
  #library .models{
    display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;
  }
  #library button{white-space:nowrap;min-height:36px;padding:8px 10px;font-size:12px}
  .viewer{order:1;flex:1;width:100%;min-height:150px}
  #telemetry{order:2}
  #telemetry .metric{padding:4px 0;font-size:10px}
  #telemetry .hint{display:none}
  #controls{bottom:7px;gap:5px}
  #controls button{font-size:11px;padding:8px;min-height:35px}
  #message{font-size:11px;top:7px}
}
@media(max-height:500px) and (max-width:900px){
  header{height:45px}
  main{height:calc(100dvh - 45px)}
  #library button{min-height:30px;padding:5px}
  #telemetry{display:none}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">HOLOMODEL // LAB</div>
    <div class="sub">INTERACTIVE 3D WORKSPACE</div>
  </div>
  <div class="status" id="systemStatus">● STARTING</div>
</header>

<main>
  <section class="panel" id="library">
    <h3>MODEL LIBRARY</h3>
    <div class="models">
      <button class="active" data-model="reactor">◇ Arc Reactor</button>
      <button data-model="earth">◉ Planet Earth</button>
      <button data-model="atom">✣ Atom</button>
      <button data-model="solar">☼ Solar System</button>
      <button data-model="crystal">◇ Crystal</button>
      <button data-model="robot">⚙ Robot Core</button>
      <button data-model="dna">⌁ DNA Helix</button>
    </div>
  </section>

  <section class="viewer" id="viewer">
    <canvas id="scene"></canvas>
    <div id="message">Building 3D lab...</div>
    <video id="handVideo" autoplay playsinline muted></video>
    <img id="handPreview" alt="Hand tracking camera preview">
    <div id="controls">
      <button id="rotateBtn">⟳ Auto: ON</button>
      <button id="minusBtn">− Zoom</button>
      <button id="plusBtn">+ Zoom</button>
      <button id="resetBtn">↻ Reset</button>
      <button id="handBtn">✋ Hand Control</button>
      <button id="importBtn">＋ Import 3D</button>
      <input id="fileInput" type="file" accept=".glb,.gltf,.obj" hidden>
    </div>
  </section>

  <section class="panel" id="telemetry">
    <h3>LIVE TELEMETRY</h3>
    <div class="telemetry">
      <div class="metric"><span>MODEL</span><span id="modelName">REACTOR</span></div>
      <div class="metric"><span>CONTROL</span><span id="controlName">TOUCH</span></div>
      <div class="metric"><span>ZOOM</span><span id="zoomText">100%</span></div>
      <div class="metric"><span>ROTATION</span><span id="rotationText">ON</span></div>
    </div>
    <div class="hint">
      Drag to rotate.<br>
      Pinch with two fingers to zoom.<br>
      Enable Hand Control to use your camera.
    </div>
    <label class="hint" for="zoomRange">ZOOM CONTROL</label>
    <input id="zoomRange" type="range" min="50" max="200" value="100">
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("scene");
const viewer = $("viewer");
const message = $("message");
const video = $("handVideo");

let scene, camera, renderer, model;
let autoRotate = true, handOn = false;
let zoom = 1, targetZoom = 1;
let handCamera = null, hands = null;
let lastHand = null, lastPinch = null;
let dragging = false, lastX = 0, lastY = 0;
let pinchStart = 0, touchStartDistance = 0;
let lastFrame = 0;

const cyan = 0x39eaff;
const blue = 0x167dff;
const green = 0x7dffe0;

function status(text){ message.textContent = text; }
function showSystem(text){ $("systemStatus").textContent = "● " + text; }

function mat(color, emissive=color){
  return new THREE.MeshStandardMaterial({
    color, emissive, emissiveIntensity:0.65,
    metalness:0.65, roughness:0.27
  });
}

function group(){return new THREE.Group()}

function ring(parent, radius, tube, color, rotation=[0,0,0]){
  const mesh = new THREE.Mesh(
    new THREE.TorusGeometry(radius,tube,12,100),mat(color)
  );
  mesh.rotation.set(...rotation);
  parent.add(mesh);
  return mesh;
}

function sphere(parent,radius,color,position=[0,0,0],detail=24){
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(radius,detail,detail),mat(color)
  );
  mesh.position.set(...position);
  parent.add(mesh);
  return mesh;
}

function cylinder(parent,r1,r2,height,color,position=[0,0,0]){
  const mesh = new THREE.Mesh(
    new THREE.CylinderGeometry(r1,r2,height,32),mat(color)
  );
  mesh.position.set(...position);
  parent.add(mesh);
  return mesh;
}

function line(parent,points,color=cyan,radius=.018){
  const curve = new THREE.CatmullRomCurve3(
    points.map(p=>new THREE.Vector3(...p))
  );
  const mesh = new THREE.Mesh(
    new THREE.TubeGeometry(curve,64,radius,6,false),mat(color)
  );
  parent.add(mesh);
  return mesh;
}

function makeReactor(){
  const g=group();
  ring(g,1,.07,cyan);
  ring(g,.77,.035,blue);
  ring(g,.51,.045,green);
  ring(g,.27,.04,cyan);
  cylinder(g,.18,.18,.16,0x0b4563);
  sphere(g,.12,green,[0,0,.12]);
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4;
    const x=Math.cos(a),y=Math.sin(a);
    const p=cylinder(g,.075,.075,.28,blue,[x*.87,y*.87,0]);
    p.rotation.z=-a;
    sphere(g,.07,cyan,[x*1.02,y*1.02,0]);
  }
  for(let i=0;i<3;i++) ring(g,.65+i*.17,.012,blue,[i*.7,i*.4,i*.8]);
  return g;
}

function makeEarth(){
  const g=group();
  const globe=new THREE.Mesh(
    new THREE.SphereGeometry(.85,48,32),
    new THREE.MeshStandardMaterial({
      color:0x087aff,emissive:0x032a7a,emissiveIntensity:.5,
      wireframe:true
    })
  );
  g.add(globe);
  sphere(g,.79,0x1642a0,[0,0,0],36).material.transparent=true;
  g.children[g.children.length-1].material.opacity=.18;
  ring(g,1.05,.018,cyan,[.7,.3,.3]);
  ring(g,1.12,.012,green,[1.1,.1,.5]);
  return g;
}

function makeAtom(){
  const g=group();
  sphere(g,.17,green);
  for(let i=0;i<3;i++){
    const r=ring(g,.9,.018,[cyan,blue,green][i],
      [i*.9, i*1.05, i*.65]);
    sphere(r,.09,green,[.9,0,0]);
  }
  return g;
}

function makeSolar(){
  const g=group();
  sphere(g,.25,0xffaa22);
  const colors=[0x64cfff,0xff8b57,0x55aaff,0xd6a16d,0xb7a5ff];
  const distances=[.55,.83,1.15,1.5,1.88];
  distances.forEach((r,i)=>{
    ring(g,r,.009,0x287eab,[.4+i*.08,.2,0]);
    sphere(g,[.055,.075,.1,.07,.14][i],colors[i],[r,0,0]);
  });
  return g;
}

function makeCrystal(){
  const g=group();
  const geometry=new THREE.OctahedronGeometry(.75,0);
  const crystal=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({
    color:0x37dcff,emissive:0x064d80,emissiveIntensity:.7,
    metalness:.6,roughness:.15,wireframe:false,flatShading:true
  }));
  g.add(crystal);
  const edges=new THREE.LineSegments(
    new THREE.EdgesGeometry(geometry),
    new THREE.LineBasicMaterial({color:green})
  );
  g.add(edges);
  ring(g,1.05,.015,cyan,[.7,.3,.4]);
  ring(g,.9,.012,blue,[.3,.9,.1]);
  return g;
}

function makeRobot(){
  const g=group();
  cylinder(g,.48,.48,.2,0x175777);
  sphere(g,.37,0x0b263c,[0,0,.24]);
  ring(g,.48,.045,cyan);
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2;
    cylinder(g,.075,.075,.45,blue,[Math.cos(a)*.62,Math.sin(a)*.62,0]);
    sphere(g,.1,green,[Math.cos(a)*.83,Math.sin(a)*.83,0]);
  }
  sphere(g,.16,cyan,[0,0,.44]);
  return g;
}

function makeDNA(){
  const g=group();
  for(let i=0;i<55;i++){
    const t=i*.15;
    const x=Math.cos(t)*.48,y=Math.sin(t)*.48,z=(i-27)*.045;
    sphere(g,.045,cyan,[x,y,z],10);
    sphere(g,.045,green,[-x,-y,z],10);
    if(i%3===0) line(g,[[x,y,z],[-x,-y,z]],blue,.012);
  }
  return g;
}

const makers={
  reactor:makeReactor,earth:makeEarth,atom:makeAtom,
  solar:makeSolar,crystal:makeCrystal,robot:makeRobot,dna:makeDNA
};
const names={
  reactor:"REACTOR",earth:"EARTH",atom:"ATOM",
  solar:"SOLAR SYSTEM",crystal:"CRYSTAL",robot:"ROBOT CORE",dna:"DNA HELIX"
};

function disposeObject(obj){
  obj.traverse(o=>{
    if(o.geometry)o.geometry.dispose();
    if(o.material){
      const materials=Array.isArray(o.material)?o.material:[o.material];
      materials.forEach(m=>m.dispose());
    }
  });
}

function setModel(type){
  if(!scene)return;
  if(model){scene.remove(model);disposeObject(model);}
  try{
    model=makers[type]();
    model.userData.type=type;
    scene.add(model);
    $("modelName").textContent=names[type];
    document.querySelectorAll("[data-model]").forEach(b=>{
      b.classList.toggle("active",b.dataset.model===type);
    });
    status(names[type]+" READY");
  }catch(e){
    console.error(e);
    status("Model error: "+e.message);
  }
}

function init(){
  if(!window.THREE){
    status("3D library load failed. Check internet and reload.");
    showSystem("3D ERROR");
    return;
  }

  try{
    scene=new THREE.Scene();
    scene.fog=new THREE.FogExp2(0x020812,.09);
    camera=new THREE.PerspectiveCamera(45,1,.1,100);
    camera.position.set(0,0,5);

    renderer=new THREE.WebGLRenderer({
      canvas,antialias:true,alpha:false,powerPreference:"high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
    renderer.setClearColor(0x020812,1);
    renderer.outputColorSpace=THREE.SRGBColorSpace;

    scene.add(new THREE.AmbientLight(0x8bcfff,1.8));
    const light=new THREE.PointLight(0x42eaff,35,15);
    light.position.set(2,3,4);scene.add(light);
    const light2=new THREE.PointLight(0x1666ff,20,12);
    light2.position.set(-3,-2,-2);scene.add(light2);

    const grid=new THREE.GridHelper(10,20,0x123e57,0x092238);
    grid.position.y=-1.5;scene.add(grid);

    setModel("reactor");
    resize();
    showSystem("ONLINE");
    status("3D LAB READY");
    animate();
  }catch(e){
    console.error(e);
    status("3D error. Reload page: "+e.message);
    showSystem("ERROR");
  }
}

function resize(){
  if(!renderer||!camera)return;
  const w=Math.max(1,viewer.clientWidth);
  const h=Math.max(1,viewer.clientHeight);
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}

function animate(now=0){
  requestAnimationFrame(animate);
  if(!renderer||!scene||!camera)return;
  const dt=Math.min((now-lastFrame)/1000||.016,.05);
  lastFrame=now;

  zoom+=(targetZoom-zoom)*.16;
  camera.position.z=5/zoom;
  $("zoomText").textContent=Math.round(zoom*100)+"%";
  $("zoomRange").value=Math.round(zoom*100);

  if(model&&autoRotate&&!dragging&&!handOn){
    model.rotation.y+=dt*.42;
    model.rotation.x+=dt*.12;
  }
  renderer.render(scene,camera);
}

document.querySelectorAll("[data-model]").forEach(btn=>{
  btn.addEventListener("click",()=>setModel(btn.dataset.model));
});

$("rotateBtn").onclick=()=>{
  autoRotate=!autoRotate;
  $("rotateBtn").textContent="⟳ Auto: "+(autoRotate?"ON":"OFF");
  $("rotationText").textContent=autoRotate?"ON":"OFF";
};

function setZoom(z){
  targetZoom=Math.max(.5,Math.min(2,z));
}
$("plusBtn").onclick=()=>setZoom(targetZoom+.15);
$("minusBtn").onclick=()=>setZoom(targetZoom-.15);
$("zoomRange").oninput=e=>setZoom(Number(e.target.value)/100);

$("resetBtn").onclick=()=>{
  setZoom(1);
  if(model)model.rotation.set(0,0,0);
  autoRotate=true;
  $("rotateBtn").textContent="⟳ Auto: ON";
  $("rotationText").textContent="ON";
  status("VIEW RESET");
};

function pointerDown(e){
  if(e.target.closest("button")||e.target.closest("input"))return;
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);
}
function pointerMove(e){
  if(!dragging||!model)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  model.rotation.y+=dx*.009;
  model.rotation.x+=dy*.009;
  lastX=e.clientX;lastY=e.clientY;
}
function pointerUp(){dragging=false}
canvas.addEventListener("pointerdown",pointerDown);
canvas.addEventListener("pointermove",pointerMove);
canvas.addEventListener("pointerup",pointerUp);
canvas.addEventListener("pointercancel",pointerUp);
canvas.addEventListener("wheel",e=>{
  e.preventDefault();setZoom(targetZoom+(e.deltaY<0?.08:-.08));
},{passive:false});

function distance(a,b){
  return Math.hypot(a.x-b.x,a.y-b.y);
}

async function startHands(){
  if(handOn){stopHands();return;}
  if(!window.Hands||!window.Camera){
    status("Hand tracking library unavailable. Check internet.");
    return;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    status("Camera needs HTTPS. Open your GitHub Pages HTTPS link.");
    return;
  }

  $("handBtn").textContent="⌛ Starting camera...";
  status("Allow camera permission when asked");

  try{
    hands=new Hands({
      locateFile:file=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+file
    });
    hands.setOptions({
      maxNumHands:1,modelComplexity:0,
      minDetectionConfidence:.55,minTrackingConfidence:.5
    });
    hands.onResults(onHandResults);

    handCamera=new Camera(video,{
      onFrame:async()=>{if(handOn&&hands)await hands.send({image:video});},
      width:640,height:480
    });
    await handCamera.start();
    handOn=true;
    lastHand=null;lastPinch=null;
    $("handBtn").textContent="✋ Stop Hand";
    $("controlName").textContent="HAND";
    $("handPreview").style.display="block";
    $("handPreview").srcObject=video.srcObject;
    status("Hand tracking active — move your hand");
  }catch(e){
    console.error(e);
    handOn=false;
    $("handBtn").textContent="✋ Hand Control";
    status("Camera failed. Allow camera access and retry.");
    showSystem("CAMERA ERROR");
    stopHands();
  }
}

function onHandResults(results){
  if(!handOn)return;
  const list=results.multiHandLandmarks;
  if(!list||!list.length){
    lastHand=null;lastPinch=null;
    status("Show your full hand to the camera");
    return;
  }
  const lm=list[0];
  const wrist=lm[0],index=lm[8],thumb=lm[4];
  const center={x:(index.x+thumb.x)/2,y:(index.y+thumb.y)/2};
  const pinch=distance(index,thumb);

  if(lastHand&&model){
    const dx=center.x-lastHand.x;
    const dy=center.y-lastHand.y;
    if(pinch<.12){
      if(lastPinch!==null){
        const delta=pinch-lastPinch;
        setZoom(targetZoom-delta*3);
      }
    }else{
      model.rotation.y-=dx*3.5;
      model.rotation.x+=dy*3.5;
    }
  }
  lastHand=center;
  lastPinch=pinch;
  status(pinch<.12?"Pinch detected — zooming":"Hand detected — move to rotate");
}

function stopHands(){
  handOn=false;
  lastHand=null;lastPinch=null;
  if(handCamera){
    try{handCamera.stop();}catch(e){}
    handCamera=null;
  }
  if(video.srcObject){
    video.srcObject.getTracks().forEach(t=>t.stop());
    video.srcObject=null;
  }
  if(hands){
    try{hands.close();}catch(e){}
    hands=null;
  }
  $("handBtn").textContent="✋ Hand Control";
  $("controlName").textContent="TOUCH";
  $("handPreview").style.display="none";
}

$("handBtn").onclick=startHands;

$("importBtn").onclick=()=>$("fileInput").click();

$("fileInput").addEventListener("change",e=>{
  const file=e.target.files[0];
  if(!file)return;
  if(!window.THREE.GLTFLoader||!window.THREE.OBJLoader){
    status("3D file loader unavailable. Check internet.");return;
  }
  const url=URL.createObjectURL(file);
  const ext=file.name.split(".").pop().toLowerCase();

  function install(obj){
    if(model){scene.remove(model);disposeObject(model);}
    model=obj;
    const box=new THREE.Box3().setFromObject(model);
    const size=box.getSize(new THREE.Vector3());
    const center=box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    const max=Math.max(size.x,size.y,size.z)||1;
    model.scale.multiplyScalar(1.8/max);
    scene.add(model);
    $("modelName").textContent="IMPORTED";
    status("3D FILE READY");
  }

  if(ext==="glb"||ext==="gltf"){
    new THREE.GLTFLoader().load(url,gltf=>{
      install(gltf.scene);URL.revokeObjectURL(url);
    },undefined,err=>{
      console.error(err);status("Unable to load this GLB/GLTF file");
      URL.revokeObjectURL(url);
    });
  }else if(ext==="obj"){
    new THREE.OBJLoader().load(url,obj=>{
      install(obj);URL.revokeObjectURL(url);
    },undefined,err=>{
      console.error(err);status("Unable to load this OBJ file");
      URL.revokeObjectURL(url);
    });
  }else{
    URL.revokeObjectURL(url);
    status("Choose a GLB, GLTF or OBJ file");
  }
  e.target.value="";
});

window.addEventListener("resize",resize);
if("ResizeObserver" in window)new ResizeObserver(resize).observe(viewer);
window.addEventListener("pagehide",stopHands);
