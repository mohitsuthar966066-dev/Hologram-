<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>HoloModel — 3D Project Viewer</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2b;--line:#21445a;--cyan:#53e6ff;--text:#e8f7ff;--muted:#9ab5c6}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(ellipse at top,#10263a 0%,var(--bg) 65%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;min-height:0}
header{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 12px;border-bottom:1px solid #17364a;background:#081522eF}
.brand{font-size:17px;font-weight:800;letter-spacing:.4px}.brand span{color:var(--cyan)}#status{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
#viewerWrap{position:relative;flex:1;min-height:0;overflow:hidden}
#viewer{position:absolute;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:10px;top:10px;max-width:calc(100% - 20px);padding:6px 9px;border:1px solid #25526a;border-radius:9px;background:#061522bd;color:#bcefff;font-size:11px;pointer-events:none}
#camBox{position:absolute;right:9px;top:9px;width:96px;height:72px;overflow:hidden;border:1px solid #3c8298;border-radius:9px;background:#061522;display:none}
#camBox video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#camLabel{position:absolute;bottom:2px;left:3px;font-size:9px;background:#061522bb;padding:1px 4px;border-radius:4px}
#bottom{flex:0 0 auto;background:#091725f5;border-top:1px solid var(--line);padding:7px 9px calc(7px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;max-height:40dvh;overflow-y:auto}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,.fileBtn{appearance:none;border:1px solid #2b586e;background:#122a3b;color:var(--text);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.15;font-weight:650;min-height:32px;white-space:nowrap;cursor:pointer}
button:active,.fileBtn:active{transform:scale(.98);background:#1b4054}
button.primary,.fileBtn.primary{border-color:#32cce8;background:#0c3a4b;color:#dffbff}
button.active{border-color:var(--cyan);color:var(--cyan)}
#models{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:1px 0 3px;scrollbar-width:thin}
#models button{flex:0 0 auto}
#uploadInput{display:none}
#fileNote{font-size:10px;color:var(--muted);line-height:1.3}
#cameraBtn{margin-left:auto}
@media(min-width:700px){header{padding:0 18px}.brand{font-size:19px}#bottom{padding:9px 14px;gap:8px}button,.fileBtn{font-size:13px;padding:8px 12px}#camBox{width:150px;height:105px}}
</style>
</head>
<body>
<div id="app">
  <header><div class="brand">◈ HOLO<span>MODEL</span></div><div id="status">Starting 3D viewer…</div></header>
  <main id="viewerWrap"><div id="viewer"></div>
    <div id="hint">Touch: rotate • Pinch: zoom • Hand tracking: turn on below</div>
    <div id="camBox"><video id="cam" playsinline muted></video><div id="camLabel">HAND TRACKING</div></div>
  </main>
  <section id="bottom">
    <div class="row">
      <button id="rotateBtn" class="active">Auto rotate: ON</button>
      <button id="resetBtn">Reset view</button>
      <label class="fileBtn primary" for="uploadInput">＋ Open 3D project</label>
      <input id="uploadInput" type="file" multiple accept=".glb,.gltf,.obj,.stl,.mtl,.bin,.png,.jpg,.jpeg,.webp">
      <button id="cameraBtn" class="primary">✋ Hand control: OFF</button>
    </div>
    <div id="models">
      <button data-model="reactor" class="active">Arc Reactor</button>
      <button data-model="solar">Solar system</button>
      <button data-model="earth">Earth</button>
      <button data-model="dna">DNA</button>
      <button data-model="atom">Atom</button>
      <button data-model="robot">Robot</button>
      <button data-model="torus">Neon sculpture</button>
    </div>
    <div id="fileNote">Project files: .glb recommended. For .gltf, select its related .bin/textures together. .obj can be opened with its .mtl/textures selected too. Files stay on your device.</div>
  </section>
</div>
