
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HoloModel Gesture Lab</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#030712;color:#e6faff;font-family:Arial,sans-serif;overflow:hidden}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #164e63;background:#07111f}
header strong{color:#67e8f9;font-size:18px}
#status{font-size:11px;color:#a5f3fc}
#viewer{position:fixed;inset:58px 0 0}
canvas{display:block;touch-action:none}
.panel{position:fixed;z-index:3;background:#081522eF;border:1px solid #164e63;border-radius:12px;padding:12px}
#controls{left:10px;top:70px;width:174px}
#gesture{right:10px;top:70px;width:145px;text-align:center}
label{font-size:12px;color:#a5f3fc;display:block;margin:5px 0}
select,button{width:100%;padding:10px;margin:4px 0;background:#102b40;color:#e6faff;border:1px solid #24718b;border-radius:8px;font-size:13px}
button:active{background:#155e75}
.small{font-size:11px;color:#9ca3af;line-height:1.5}
#cam{position:fixed;right:10px;bottom:92px;width:116px;height:88px;object-fit:cover;transform:scaleX(-1);border:1px solid #22d3ee;border-radius:9px;z-index:2;background:#111827}
#help{position:fixed;bottom:8px;left:8px;right:8px;text-align:center;font-size:11px;color:#bae6fd;pointer-events:none}
@media(max-width:380px){#controls{width:145px}#gesture{width:125px}#cam{width:92px;height:70px}}
</style>
</head>
<body>
<header>
<strong>◈ HOLOMODEL</strong>
<span id="status">Starting 3D...</span>
</header>

<div id="viewer"></div>

<div class="panel" id="controls">
<label>3D MODEL</label>
<select id="model">
<option value="reactor">Arc Reactor</option>
<option value="planet">Planet</option>
<option value="atom">Atom</option>
<option value="crystal">Crystal</option>
</select>
<button id="start">Enable Hand Tracking</button>
<button id="reset">Reset View</button>
<label>Manual Zoom</label>
<button id="zin">＋ Zoom In</button>
<button id="zout">－ Zoom Out</button>
<p class="small">Touch and drag the model to rotate it.</p>
</div>

<div class="panel" id="gesture">
<strong>HAND CONTROL</strong>
<p id="handStatus" class="small">Press Enable Hand Tracking</p>
<p class="small">☝ Move index finger: rotate<br>🤏 Pinch: zoom</p>
</div>

<video id="cam" autoplay playsinline muted></video>
<div id="help">Allow camera access • Use bright lighting • Keep your hand visible</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $=id=>document.getElementById(id);
const status=$('status'), handStatus=$('handStatus');
const viewer=$('viewer'), video=$('cam');

let scene,camera,renderer,modelGroup;
let targetRX=0.25,targetRY=0.5;
let zoom=6, targetZoom=6;
let hands=null, stream=null, tracking=false, busy=false;
let lastX=null,lastY=null,lastPinch=null;
let handSeen=false, lastSeenTime=0;
let lastProcess=0;

function init3D(){
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x030712);

  camera=new THREE.PerspectiveCamera(
    45,innerWidth/(innerHeight-58),0.1,100
  );
  camera.position.set(0,0,zoom);

  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.setSize(innerWidth,innerHeight-58);
  viewer.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x8bdcff,2));
  const light=new THREE.PointLight(0x00d9ff,65);
  light.position.set(3,4,5);scene.add(light);
  const light2=new THREE.PointLight(0x7c3aed,35);
  light2.position.set(-4,-2,1);scene.add(light2);

  const grid=new THREE.GridHelper(18,36,0x155e75,0x10283c);
  grid.position.y=-2.2;scene.add(grid);

  modelGroup=new THREE.Group();
  scene.add(modelGroup);
  makeModel('reactor');

  renderer.domElement.addEventListener('pointerdown',e=>{
    renderer.domElement.setPointerCapture(e.pointerId);
    lastX=e.clientX;lastY=e.clientY;
  });
  renderer.domElement.addEventListener('pointermove',e=>{
    if(e.buttons===0)return;
    const dx=e.clientX-lastX,dy=e.clientY-lastY;
    targetRY+=dx*0.009;targetRX+=dy*0.009;
    lastX=e.clientX;lastY=e.clientY;
  });
  renderer.domElement.addEventListener('pointerup',()=>{
    lastX=null;lastY=null;
  });
  renderer.domElement.addEventListener('wheel',e=>{
    targetZoom=THREE.MathUtils.clamp(targetZoom+e.deltaY*0.01,2.8,12);
  },{passive:true});

  animate();
}

function material(color,metalness=0.65,roughness=0.25){
  return new THREE.MeshStandardMaterial({
    color,metalness,roughness,emissive:color,
    emissiveIntensity:0.22
  });
}
function addMesh(geometry,mat,x=0,y=0,z=0){
  const mesh=new THREE.Mesh(geometry,mat);
  mesh.position.set(x,y,z);modelGroup.add(mesh);return mesh;
}
function torus(radius,tube,mat,z=0){
  return addMesh(new THREE.TorusGeometry(radius,tube,12,100),mat,0,0,z);
}
function makeModel(type){
  while(modelGroup.children.length){
    const obj=modelGroup.children.pop();
    obj.geometry?.dispose();
    if(Array.isArray(obj.material))obj.material.forEach(m=>m.dispose());
    else obj.material?.dispose();
  }
  const cyan=material(0x22d3ee),blue=material(0x2563eb);
  const gold=material(0xfbbf24),white=material(0xcffafe);
  if(type==='reactor'){
    torus(1.12,.12,blue);
    torus(.87,.075,cyan,.05);
    torus(.52,.07,gold,.1);
    torus(.25,.055,white,.15);
    addMesh(new THREE.CylinderGeometry(.19,.19,.16,6),cyan,0,0,.12);
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4;
      const bar=addMesh(
        new THREE.BoxGeometry(.11,.38,.1),gold,
        Math.cos(a)*.7,Math.sin(a)*.7,.08
      );
      bar.rotation.z=a;
    }
  }else if(type==='planet'){
    addMesh(new THREE.SphereGeometry(.75,40,32),material(0x2563eb));
    const ring=torus(1.15,.045,gold);
    ring.rotation.x=1.05;
    const ring2=torus(1.35,.025,cyan);
    ring2.rotation.x=1.05;
    for(let i=0;i<35;i++){
      const a=i*2.4,r=.95+(i%5)*.075;
      addMesh(new THREE.SphereGeometry(.025,8,8),white,
        Math.cos(a)*r,Math.sin(a)*r*.55,0);
    }
  }else if(type==='atom'){
    addMesh(new THREE.SphereGeometry(.18,24,24),gold);
    for(let i=0;i<3;i++){
      const e=torus(1,.035,[cyan,blue,gold][i]);
      e.rotation.x=i*Math.PI/3;
      e.rotation.y=i*Math.PI/2.5;
      const p=addMesh(new THREE.SphereGeometry(.12,16,16),white);
      p.position.set(Math.cos(i*2.1),Math.sin(i*2.1),.2);
    }
  }else{
    const crystal=addMesh(new THREE.OctahedronGeometry(1.2,0),cyan);
    crystal.material=material(0x22d3ee,.4,.12);
    const inner=addMesh(new THREE.OctahedronGeometry(.65,0),gold);
    inner.rotation.set(.5,.5,.3);
    torus(1.5,.025,blue);
  }
}

function animate(){
  requestAnimationFrame(animate);
  if(!modelGroup)return;
  modelGroup.rotation.x+=(targetRX-modelGroup.rotation.x)*.12;
  modelGroup.rotation.y+=(targetRY-modelGroup.rotation.y)*.12;
  zoom+=(targetZoom-zoom)*.14;
  camera.position.z=zoom;
  camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}

$('model').onchange=e=>makeModel(e.target.value);
$('reset').onclick=()=>{
  targetRX=.25;targetRY=.5;targetZoom=6;
};
$('zin').onclick=()=>targetZoom=Math.max(2.8,targetZoom-.6);
$('zout').onclick=()=>targetZoom=Math.min(12,targetZoom+.6);

addEventListener('resize',()=>{
  if(!renderer)return;
  camera.aspect=innerWidth/(innerHeight-58);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight-58);
});

function onHandResults(results){
  const list=results.multiHandLandmarks;
  handSeen=!!(list&&list.length);
  if(!handSeen){
    lastX=lastY=lastPinch=null;
    handStatus.textContent='Hand not detected';
    return;
  }
  lastSeenTime=Date.now();
  const lm=list[0];
  // MediaPipe landmarks: thumb tip 4, index tip 8.
  const x=1-lm[8].x;
  const y=lm[8].y;
  const dx=lastX===null?0:x-lastX;
  const dy=lastY===null?0:y-lastY;

  // Delta-based rotation prevents the model snapping to a new angle.
  if(lastX!==null){
    targetRY+=dx*5.0;
    targetRX+=dy*4.0;
    targetRX=THREE.MathUtils.clamp(targetRX,-1.5,1.5);
  }
  lastX=x;lastY=y;

  // Pinch distance in normalized camera coordinates.
  const tx=lm[4].x-lm[8].x;
  const ty=lm[4].y-lm[8].y;
  const pinch=Math.sqrt(tx*tx+ty*ty);

  if(lastPinch!==null){
    const change=pinch-lastPinch;
    if(Math.abs(change)>.006){
      targetZoom=THREE.MathUtils.clamp(
        targetZoom-change*15,2.8,12
      );
    }
  }
  lastPinch=pinch;
  handStatus.textContent=pinch<.065
    ?'Pinch detected • Zoom'
    :'Hand tracked • Move to rotate';
}

async function startTracking(){
  if(tracking)return;
  $('start').disabled=true;
  status.textContent='Starting camera...';
  handStatus.textContent='Requesting camera access';
  try{
    if(!window.Hands)throw new Error('MediaPipe script failed to load');
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:'user',
        width:{ideal:640},
        height:{ideal:480}
      }
    });
    video.srcObject=stream;
    await video.play();

    hands=new window.Hands({
      locateFile:file=>
        'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+file
    });
    hands.setOptions({
      maxNumHands:1,
      modelComplexity:0,
      minDetectionConfidence:.6,
      minTrackingConfidence:.55
    });
    hands.onResults(onHandResults);
    tracking=true;
    status.textContent='Camera ready';
    handStatus.textContent='Show one hand to camera';
    $('start').textContent='Hand Tracking Active';
    processVideo();
  }catch(err){
    status.textContent='Camera/tracking error';
    handStatus.textContent=err.message||'Could not start camera';
    $('start').disabled=false;
    console.error(err);
  }
}

async function processVideo(){
  if(!tracking||!hands)return;
  if(video.readyState>=2&&!busy&&video.currentTime!==lastProcess){
    busy=true;
    lastProcess=video.currentTime;
    try{await hands.send({image:video});}
    catch(err){console.error('Hand tracking error',err);}
    finally{busy=false;}
  }
  requestAnimationFrame(processVideo);
}

$('start').onclick=startTracking;
try{init3D();status.textContent='3D ready';}
catch(err){status.textContent='3D failed';console.error(err);}
</script>
</body>
  </html>
